name: R Shiny smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::ggplot2
            any::quantmod
            any::TTR
            any::xts
            any::zoo
      - name: Parse app and validate calculations
        run: |
          Rscript -e 'parse("app.R"); source("app.R", local=TRUE); print("R source parsed successfully")'
      - name: Start Shiny and check HTTP response
        run: |
          Rscript -e 'shiny::runApp(".", host="127.0.0.1", port=3838, launch.browser=FALSE)' > shiny.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true; cat shiny.log' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3838/ > /tmp/shiny.html; then
              grep -q 'BDA400' /tmp/shiny.html
              echo 'Shiny HTTP smoke test passed'
              exit 0
            fi
            sleep 2
          done
          echo 'Shiny failed to start'
          exit 1
